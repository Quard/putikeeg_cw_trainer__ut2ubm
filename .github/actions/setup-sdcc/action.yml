name: Set up SDCC
description: Install the official SDCC Linux binary release and add it to PATH.

inputs:
  version:
    description: SDCC version.
    default: "4.6.0"
  sha256:
    description: SHA-256 of the release archive.
    default: f6b929c62ed3082a26087885e0f1f9bf41878602ef1f57e40b11b4a01bf4f366

runs:
  using: composite
  steps:
    - name: Restore SDCC from cache
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/sdcc
        key: sdcc-${{ inputs.version }}-${{ inputs.sha256 }}-${{ runner.os }}-${{ runner.arch }}

    # The Ubuntu package is older than 4.6.0 and does not produce the same image.
    - name: Download SDCC
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDCC_VERSION: ${{ inputs.version }}
        SDCC_SHA256: ${{ inputs.sha256 }}
        SDCC_DIR: ${{ runner.temp }}/sdcc
      run: |
        archive="${RUNNER_TEMP}/sdcc.tar.bz2"
        curl -fsSL --retry 5 --retry-all-errors -o "${archive}" \
          "https://downloads.sourceforge.net/project/sdcc/sdcc-linux-amd64/${SDCC_VERSION}/sdcc-${SDCC_VERSION}-amd64-unknown-linux2.5.tar.bz2"
        echo "${SDCC_SHA256}  ${archive}" | sha256sum --check
        mkdir -p "${SDCC_DIR}"
        tar -xjf "${archive}" -C "${SDCC_DIR}" --strip-components=1
        rm "${archive}"

    - name: Add SDCC to PATH
      shell: bash
      run: |
        echo "${RUNNER_TEMP}/sdcc/bin" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/sdcc/bin/sdcc" --version | head -n 1
