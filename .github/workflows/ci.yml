name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request cancels the old run. Runs on develop and on tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  test:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: firmware/test.sh

  build:
    name: Firmware build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-sdcc

      - run: firmware/build.sh

      - name: Write the memory report to the job summary
        run: |
          {
            echo "## Firmware $(head -n 1 firmware/VERSION) (${GITHUB_SHA::7})"
            echo '```'
            cat firmware/build/putikeeg_cw_trainer.mem
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            firmware/VERSION
            firmware/build/putikeeg_cw_trainer.ihx
            firmware/build/putikeeg_cw_trainer.mem
            firmware/build/putikeeg_cw_trainer.map
          if-no-files-found: error
